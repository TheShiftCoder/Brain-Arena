<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brain Arena | Chimp Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            burgundy: '#5B1423',
            coral: '#FF5353',
            sunny: '#FFC837',
            mint: '#83D3A3',
            softwhite: '#FDFCFA',
          },
          fontFamily: {
            nunito: ['Nunito', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Nunito', sans-serif; }
    .tile-btn { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: white; cursor: pointer; transition: all 0.2s; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-FpcaNwRLdZSWh5-CYzQkh6tu_ouWk7A",
      authDomain: "brainarena-cfe76.firebaseapp.com",
      databaseURL: "https://brainarena-cfe76-default-rtdb.firebaseio.com",
      projectId: "brainarena-cfe76",
      storageBucket: "brainarena-cfe76.firebasestorage.app",
      messagingSenderId: "23262900711",
      appId: "1:23262900711:web:fd6be7115114c0cec8cd42"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadScores();
      }
    });

    function loadScores() {
      if (!currentUser) return;
      get(ref(db, 'users/' + currentUser.uid + '/scores/chimp')).then((snapshot) => {
        if (snapshot.exists()) {
          window.scores = snapshot.val() || [];
          window.updateScoreDisplay();
        }
      });
    }

    window.saveScores = () => {
      if (!currentUser) return;
      set(ref(db, 'users/' + currentUser.uid + '/scores/chimp'), window.scores);
    }
  </script>
</head>
<body class="bg-softwhite text-gray-800 min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-100 py-4 px-6 md:px-12 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-sunny rounded-lg flex items-center justify-center">
        <i data-lucide="brain" class="text-white w-5 h-5"></i>
      </div>
      <a href="../index.html" class="text-xl font-bold text-burgundy">Brain Arena</a>
    </div>
    <nav class="hidden lg:flex items-center gap-8 text-gray-500 font-bold text-[11px] uppercase tracking-wider">
      <a href="../index.html" class="hover:text-burgundy">Home</a>
      <a href="../leaderboard.html" class="hover:text-burgundy">Leaderboards</a>
      <a href="../about.html" class="hover:text-burgundy">About</a>
    </nav>
  </header>

  <main class="flex-1 max-w-4xl mx-auto w-full px-6 py-12">
    <div id="gameBox" class="bg-burgundy rounded-2xl min-h-[500px] flex flex-col items-center justify-center text-center p-8 text-white relative">
      <div id="startScreen" class="space-y-6">
        <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center mx-auto">
          <i data-lucide="brain-circuit" class="w-8 h-8"></i>
        </div>
        <h1 class="text-4xl font-bold">Chimp Test</h1>
        <p class="text-lg opacity-80 max-w-md mx-auto">Click the squares in numerical order. The numbers will disappear after the first click.</p>
        <button id="startBtn" class="bg-white text-burgundy px-8 py-3 rounded-full font-bold text-lg">Click to Start</button>
      </div>

      <div id="gamePlay" class="hidden w-full max-w-md flex flex-col items-center">
        <div class="flex justify-between w-full mb-6">
          <div class="text-left">
            <p class="text-[10px] font-bold uppercase tracking-widest opacity-60">Level</p>
            <p id="levelDisplay" class="text-2xl font-bold">1</p>
          </div>
          <div class="text-right">
            <p class="text-[10px] font-bold uppercase tracking-widest opacity-60">Status</p>
            <p id="statusText" class="text-lg font-bold">Memorize!</p>
          </div>
        </div>
        <div id="gameGrid" class="grid grid-cols-5 gap-2 w-full bg-white/5 p-4 rounded-2xl"></div>
        <p id="actionText" class="mt-4 text-sm opacity-80">Study the numbers...</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
      <div class="bg-white border border-gray-100 p-6 rounded-2xl text-center">
        <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-1">Last Level</p>
        <p id="lastScore" class="text-2xl font-bold text-burgundy">Level 0</p>
      </div>
      <div class="bg-white border border-gray-100 p-6 rounded-2xl text-center">
        <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-1">Avg Level</p>
        <p id="avgScore" class="text-2xl font-bold text-burgundy">Level 0</p>
      </div>
      <div class="bg-white border border-gray-100 p-6 rounded-2xl text-center">
        <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-1">Best Level</p>
        <p id="bestScore" class="text-2xl font-bold text-burgundy">Level 0</p>
      </div>
    </div>
  </main>

  <footer class="bg-burgundy text-white py-12 px-6 mt-12 text-center opacity-40 text-[9px] font-bold uppercase tracking-widest">
    <p>© 2024 Brain Arena. An Open Source Project.</p>
  </footer>

  <script>
    lucide.createIcons();
    const startScreen = document.getElementById("startScreen");
    const gamePlay = document.getElementById("gamePlay");
    const gameGrid = document.getElementById("gameGrid");
    const startBtn = document.getElementById("startBtn");
    const levelDisplay = document.getElementById("levelDisplay");
    const statusText = document.getElementById("statusText");
    const actionText = document.getElementById("actionText");
    const lastScoreEl = document.getElementById("lastScore");
    const avgScoreEl = document.getElementById("avgScore");
    const bestScoreEl = document.getElementById("bestScore");

    let currentLevel = 1;
    let tiles = [];
    let playerProgress = [];
    let inputEnabled = false;
    window.scores = [];

    window.updateScoreDisplay = () => {
      if (window.scores.length > 0) {
        lastScoreEl.textContent = `Level ${window.scores[window.scores.length - 1]}`;
        avgScoreEl.textContent = `Level ${Math.round(window.scores.reduce((a, b) => a + b) / window.scores.length)}`;
        bestScoreEl.textContent = `Level ${Math.max(...window.scores)}`;
      }
    };

    function generateRound() {
      gameGrid.innerHTML = "";
      tiles = [];
      playerProgress = [];
      levelDisplay.textContent = currentLevel;
      statusText.textContent = "Memorize!";
      actionText.textContent = "Study the numbers...";

      const numTiles = currentLevel + 3;
      const positions = Array.from({length: 25}, (_, i) => i);

      for (let i = 1; i <= numTiles; i++) {
        const idx = Math.floor(Math.random() * positions.length);
        const pos = positions.splice(idx, 1)[0];
        tiles.push({number: i, pos: pos});
      }

      for (let i = 0; i < 25; i++) {
        const tile = document.createElement("div");
        tile.className = "tile-btn rounded-lg bg-white/5 hover:bg-white/10";
        tile.dataset.pos = i;
        const tileData = tiles.find(t => t.pos === i);
        if (tileData) {
          tile.textContent = tileData.number;
          tile.classList.add("bg-white/20");
        }
        tile.addEventListener("click", () => handleTileClick(i));
        gameGrid.appendChild(tile);
      }

      setTimeout(() => { inputEnabled = true; actionText.textContent = "Click tile #1 to start!"; }, 1500);
    }

    function handleTileClick(pos) {
      if (!inputEnabled) return;
      const tileData = tiles.find(t => t.pos === pos);
      const clickedTile = gameGrid.children[pos];

      if (!tileData) { endGame(); return; }
      const expected = playerProgress.length + 1;
      if (tileData.number !== expected) { endGame(); return; }

      playerProgress.push(tileData.number);
      clickedTile.textContent = "";
      clickedTile.classList.remove("bg-white/20");
      clickedTile.classList.add("bg-white/80");

      if (playerProgress.length === 1) {
        statusText.textContent = "Playing";
        actionText.textContent = "Recall the order...";
        Array.from(gameGrid.children).forEach((child, i) => {
          if (tiles.find(t => t.pos === i)) child.textContent = "";
        });
      }

      if (playerProgress.length === tiles.length) {
        inputEnabled = false;
        currentLevel++;
        setTimeout(generateRound, 500);
      }
    }

    function startGame() {
      currentLevel = 1;
      startScreen.classList.add("hidden");
      gamePlay.classList.remove("hidden");
      generateRound();
    }

    function endGame() {
      inputEnabled = false;
      window.scores.push(currentLevel);
      window.saveScores();
      window.updateScoreDisplay();
      startScreen.classList.remove("hidden");
      gamePlay.classList.add("hidden");
      document.querySelector("#startScreen h1").textContent = "Game Over!";
      document.querySelector("#startScreen p").textContent = `Level reached: ${currentLevel}`;
      startBtn.textContent = "Try Again";
    }

    startBtn.addEventListener("click", startGame);
  </script>
</body>
</html>

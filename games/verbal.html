<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brain Arena | Verbal Memory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            burgundy: '#5B1423',
            coral: '#FF5353',
            sunny: '#FFC837',
            mint: '#83D3A3',
            softwhite: '#FDFCFA',
          },
          fontFamily: {
            nunito: ['Nunito', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Nunito', sans-serif; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-FpcaNwRLdZSWh5-CYzQkh6tu_ouWk7A",
      authDomain: "brainarena-cfe76.firebaseapp.com",
      databaseURL: "https://brainarena-cfe76-default-rtdb.firebaseio.com",
      projectId: "brainarena-cfe76",
      storageBucket: "brainarena-cfe76.firebasestorage.app",
      messagingSenderId: "23262900711",
      appId: "1:23262900711:web:fd6be7115114c0cec8cd42"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadScores();
      }
    });

    function loadScores() {
      if (!currentUser) return;
      get(ref(db, 'users/' + currentUser.uid + '/scores/verbal')).then((snapshot) => {
        if (snapshot.exists()) {
          window.scores = snapshot.val() || [];
          window.updateScoreDisplay();
        }
      });
    }

    window.saveScores = () => {
      if (!currentUser) return;
      set(ref(db, 'users/' + currentUser.uid + '/scores/verbal'), window.scores);
    }
  </script>
</head>
<body class="bg-softwhite text-gray-800 min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-100 py-4 px-6 md:px-12 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-sunny rounded-lg flex items-center justify-center">
        <i data-lucide="brain" class="text-white w-5 h-5"></i>
      </div>
      <a href="../index.html" class="text-xl font-bold text-burgundy">Brain Arena</a>
    </div>
    <nav class="hidden lg:flex items-center gap-8 text-gray-500 font-bold text-[11px] uppercase tracking-wider">
      <a href="../index.html" class="hover:text-burgundy">Home</a>
      <a href="../leaderboard.html" class="hover:text-burgundy">Leaderboards</a>
      <a href="../about.html" class="hover:text-burgundy">About</a>
    </nav>
  </header>

  <main class="flex-1 max-w-4xl mx-auto w-full px-6 py-12">
    <div id="testContainer" class="bg-burgundy rounded-2xl min-h-[400px] flex flex-col items-center justify-center text-center p-8 text-white relative">
      <div id="startScreen" class="space-y-6">
        <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center mx-auto">
          <i data-lucide="type" class="w-8 h-8"></i>
        </div>
        <h1 class="text-4xl font-bold">Verbal Memory</h1>
        <p class="text-lg opacity-80 max-w-md mx-auto">You will be shown words. If you have seen the word before, click SEEN. If it is a new word, click NEW.</p>
        <button onclick="startTest()" class="bg-white text-burgundy px-8 py-3 rounded-full font-bold text-lg">Click to Start</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
      <div class="bg-white border border-gray-100 p-6 rounded-2xl text-center">
        <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-1">Last Score</p>
        <p id="lastScore" class="text-2xl font-bold text-burgundy">0</p>
      </div>
      <div class="bg-white border border-gray-100 p-6 rounded-2xl text-center">
        <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-1">Average</p>
        <p id="avgScore" class="text-2xl font-bold text-burgundy">0</p>
      </div>
      <div class="bg-white border border-gray-100 p-6 rounded-2xl text-center">
        <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-1">Best</p>
        <p id="bestScore" class="text-2xl font-bold text-burgundy">0</p>
      </div>
    </div>
  </main>

  <footer class="bg-burgundy text-white py-12 px-6 mt-12 text-center opacity-40 text-[9px] font-bold uppercase tracking-widest">
    <p>© 2024 Brain Arena. An Open Source Project.</p>
  </footer>

  <script>
    lucide.createIcons();
    const lastScoreEl = document.getElementById("lastScore");
    const avgScoreEl = document.getElementById("avgScore");
    const bestScoreEl = document.getElementById("bestScore");

    let testState = {
      baseWords: ['APPLE','WINDOW','ORANGE','GUITAR','MOUNTAIN','RIVER','PIANO','SUNSET','LIBRARY','DESERT','OCEAN','BRIDGE','FOREST','TELESCOPE','DIAMOND','THUNDER','BUTTERFLY','LANTERN','ELEPHANT','CRYSTAL'],
      words: [], seenWords: new Set(), currentWordIndex: 0, score: 0, correctAnswers: 0, wrongAnswers: 0, testActive: false
    };
    window.scores = [];

    window.updateScoreDisplay = () => {
      if (window.scores.length > 0) {
        lastScoreEl.textContent = window.scores[window.scores.length - 1];
        avgScoreEl.textContent = Math.round(window.scores.reduce((a, b) => a + b) / window.scores.length);
        bestScoreEl.textContent = Math.max(...window.scores);
      }
    };

    function shuffleArray(a){const s=[...a];for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}return s}
    function generateSequence(){let s=shuffleArray(testState.baseWords); s=s.concat(shuffleArray(testState.baseWords).slice(0,15)); return s;}

    function startTest(){
      testState.testActive=true; testState.seenWords.clear(); testState.currentWordIndex=0; testState.score=0; testState.correctAnswers=0; testState.wrongAnswers=0;
      testState.words = generateSequence();
      renderTest();
    }

    function renderTest(){
      const tc = document.getElementById('testContainer');
      tc.innerHTML = `
        <div class="space-y-8 w-full max-w-sm">
          <div class="text-6xl font-bold tracking-tight" id="wordDisplay">${testState.words[0]}</div>
          <div class="flex gap-4 justify-center">
            <button onclick="answerQuestion(true)" class="bg-white text-burgundy px-10 py-3 rounded-full font-bold">SEEN</button>
            <button onclick="answerQuestion(false)" class="bg-coral text-white px-10 py-3 rounded-full font-bold">NEW</button>
          </div>
          <div class="text-xs opacity-60 uppercase tracking-widest" id="counter">Word 1 of ${testState.words.length}</div>
        </div>`;
    }

    window.answerQuestion = (seen) => {
      const currentWord = testState.words[testState.currentWordIndex];
      const wasSeen = testState.seenWords.has(currentWord);
      if (seen === wasSeen) { testState.score += 10; testState.correctAnswers++; } else { testState.wrongAnswers++; }
      testState.seenWords.add(currentWord);
      testState.currentWordIndex++;
      if (testState.currentWordIndex >= testState.words.length) endTest(); else updateWord();
    };

    function updateWord(){
      document.getElementById('wordDisplay').textContent = testState.words[testState.currentWordIndex];
      document.getElementById('counter').textContent = `Word ${testState.currentWordIndex + 1} of ${testState.words.length}`;
    }

    function endTest(){
      testState.testActive = false;
      window.scores.push(testState.score);
      window.saveScores();
      window.updateScoreDisplay();
      document.getElementById('testContainer').innerHTML = `
        <div class="space-y-6">
          <h1 class="text-4xl font-bold">Complete!</h1>
          <p class="text-2xl font-bold">Score: ${testState.score}</p>
          <button onclick="startTest()" class="bg-white text-burgundy px-8 py-3 rounded-full font-bold">Try Again</button>
        </div>`;
    }
  </script>
</body>
</html>

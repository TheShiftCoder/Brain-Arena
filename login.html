<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brain Arena | Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            burgundy: '#5B1423',
            coral: '#FF5353',
            sunny: '#FFC837',
            mint: '#83D3A3',
            softwhite: '#FDFCFA',
          },
          fontFamily: {
            nunito: ['Nunito', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
    } else {
        document.documentElement.classList.remove('dark')
    }
  </script>
  <style>
    body { font-family: 'Nunito', sans-serif; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, GithubAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-FpcaNwRLdZSWh5-CYzQkh6tu_ouWk7A",
      authDomain: "brainarena-cfe76.firebaseapp.com",
      databaseURL: "https://brainarena-cfe76-default-rtdb.firebaseio.com",
      projectId: "brainarena-cfe76",
      storageBucket: "brainarena-cfe76.firebasestorage.app",
      messagingSenderId: "23262900711",
      appId: "1:23262900711:web:fd6be7115114c0cec8cd42"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    function syncUser(user) {
      const userRef = ref(db, 'users/' + user.uid);
      update(userRef, {
        uid: user.uid,
        displayName: user.displayName || user.email.split('@')[0],
        email: user.email,
        photoURL: user.photoURL || '',
        lastLogin: new Date().toISOString()
      }).then(() => {
        window.location.href = 'index.html';
      });
    }

    // Email/Password Login
    const loginForm = document.getElementById('login-form');
    if (loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const submitBtn = loginForm.querySelector('button[type="submit"]');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        signInWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
            syncUser(userCredential.user);
          })
          .catch((error) => {
            alert(error.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
          });
      });
    }

    // Google Login
    window.signInWithGoogle = () => {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider)
        .then((result) => syncUser(result.user))
        .catch((error) => alert(error.message));
    };

    // GitHub Login
    window.signInWithGithub = () => {
      const provider = new GithubAuthProvider();
      signInWithPopup(auth, provider)
        .then((result) => syncUser(result.user))
        .catch((error) => alert(error.message));
    };
  </script>
</head>
<body class="bg-softwhite text-gray-800 dark:bg-slate-950 dark:text-gray-100 min-h-screen flex flex-col selection:bg-coral selection:text-white transition-colors duration-300">

  <!-- Navbar -->
  <header class="bg-white dark:bg-slate-900 border-b border-gray-100 dark:border-slate-800 py-4 px-6 md:px-12 flex items-center justify-between sticky top-0 z-50 transition-colors duration-300">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-sunny rounded-lg flex items-center justify-center">
        <i data-lucide="brain" class="text-white w-5 h-5"></i>
      </div>
      <a href="index.html" class="text-xl font-bold text-burgundy dark:text-white">Brain Arena</a>
    </div>

    <nav class="hidden lg:flex items-center gap-8 text-gray-500 dark:text-gray-400 font-bold text-[11px] uppercase tracking-wider">
      <a href="index.html" class="hover:text-burgundy dark:hover:text-white transition-colors">Home</a>
      <a href="leaderboard.html" class="hover:text-burgundy dark:hover:text-white transition-colors">Leaderboards</a>
      <a href="about.html" class="hover:text-burgundy dark:hover:text-white transition-colors">About</a>
    </nav>

    <div class="flex items-center gap-6">
      <button id="theme-toggle" class="text-gray-500 dark:text-gray-400 hover:text-burgundy dark:hover:text-white transition-colors">
        <i id="moon-icon" data-lucide="moon" class="w-5 h-5"></i>
        <i id="sun-icon" data-lucide="sun" class="w-5 h-5 hidden"></i>
      </button>
      <a href="login.html" class="text-burgundy dark:text-white font-bold text-[11px] uppercase tracking-wider">Sign In</a>
      <a href="#" class="bg-coral text-white px-6 py-2 rounded-full font-bold text-xs">Get Started</a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-6 py-12">
    <div class="w-full max-w-md space-y-8">
      <!-- Logo and Heading -->
      <div class="text-center space-y-4">
        <div class="w-16 h-16 bg-sunny rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-sunny/20">
          <i data-lucide="brain" class="text-white w-10 h-10"></i>
        </div>
        <div class="space-y-1">
          <h1 class="text-3xl font-extrabold text-burgundy dark:text-white">Welcome Back</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400">Please enter your details to sign in.</p>
        </div>
      </div>

      <!-- Social Login -->
      <div class="grid grid-cols-2 gap-4">
        <button onclick="signInWithGoogle()" class="flex items-center justify-center gap-2 px-4 py-3 border border-gray-200 dark:border-slate-800 rounded-xl hover:bg-gray-50 dark:hover:bg-slate-900 transition-colors font-bold text-[10px] uppercase tracking-wider text-gray-600 dark:text-gray-300">
          <svg viewBox="0 0 24 24" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg> Google
        </button>
        <button onclick="signInWithGithub()" class="flex items-center justify-center gap-2 px-4 py-3 border border-gray-200 dark:border-slate-800 rounded-xl hover:bg-gray-50 dark:hover:bg-slate-900 transition-colors font-bold text-[10px] uppercase tracking-wider text-gray-600 dark:text-gray-300">
          <svg viewBox="0 0 24 24" class="w-4 h-4 fill-current text-[#24292e] dark:text-white" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg> GitHub
        </button>
      </div>

      <div class="relative flex items-center justify-center py-2">
        <div class="flex-grow border-t border-gray-200 dark:border-slate-800"></div>
        <span class="flex-shrink mx-4 text-[9px] font-bold uppercase tracking-widest text-gray-400">Or continue with</span>
        <div class="flex-grow border-t border-gray-200 dark:border-slate-800"></div>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-4">
        <div class="space-y-1">
          <label for="email" class="text-[10px] font-bold uppercase tracking-widest text-gray-500 dark:text-gray-400 ml-1">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="mail" class="w-4 h-4 text-gray-400"></i>
            </div>
            <input type="email" id="email" placeholder="name@example.com" class="w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-sunny transition-all text-sm dark:text-white">
          </div>
        </div>

        <div class="space-y-1">
            <div class="flex justify-between items-center ml-1">
                <label for="password" class="text-[10px] font-bold uppercase tracking-widest text-gray-500 dark:text-gray-400">Password</label>
                <a href="#" class="text-[9px] font-bold uppercase tracking-widest text-coral hover:underline">Forgot?</a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i data-lucide="lock" class="w-4 h-4 text-gray-400"></i>
              </div>
              <input type="password" id="password" placeholder="••••••••" class="w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-sunny transition-all text-sm dark:text-white">
            </div>
        </div>

        <div class="flex items-center gap-2 py-2 ml-1">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-coral focus:ring-coral transition-colors">
            <label for="remember" class="text-xs text-gray-500 dark:text-gray-400 font-medium select-none cursor-pointer">Remember for 30 days</label>
        </div>

        <button type="submit" class="w-full bg-burgundy dark:bg-coral text-white py-4 rounded-xl font-bold text-xs uppercase tracking-widest hover:opacity-90 transition-opacity shadow-lg shadow-burgundy/20 dark:shadow-coral/20">Sign In</button>
      </form>

      <p class="text-center text-xs text-gray-500 dark:text-gray-400">
        Don't have an account? <a href="signup.html" class="text-burgundy dark:text-sunny font-bold hover:underline">Sign up for free</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-burgundy dark:bg-slate-900 text-white pt-12 pb-8 px-6 md:px-12 transition-colors duration-300">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-[9px] font-bold uppercase tracking-widest opacity-40">
      <p>© 2024 Brain Arena. An Open Source Project.</p>
      <div class="flex gap-6">
        <a href="#" class="hover:text-white transition-colors">Privacy Policy</a>
        <a href="#" class="hover:text-white transition-colors">Terms of Service</a>
      </div>
    </div>
  </footer>

  <script src="theme.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
